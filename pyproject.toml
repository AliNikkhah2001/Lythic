[project]
name = "lythic"
version = "0.1.0"
description = "Lythic — Obsidian 1:1 clone in Python (PySide6 LGPL, vault + graph + git sync)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ali Nikkhah" }]
keywords = ["obsidian", "vault", "knowledge-graph", "pyside6", "markdown"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Environment :: X11 Applications :: Qt",
]
dependencies = [
  "PySide6>=6.7,<7",
  "markdown-it-py>=3.0,<4",
  "mdit-py-plugins>=0.4.1",
  "python-frontmatter>=1.0",
  "watchdog>=4.0",
  "dulwich>=0.22",
  "keyring>=24",
  "pathspec>=0.11",
  "networkx>=3.0",
  "structlog>=24",
  "Pygments>=2.17",
  "openpyxl>=3.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4",
  "pytest-cov>=5",
  "syrupy>=4",
  "ruff>=0.8",
  "mypy>=1.10",
  "hypothesis>=6",
  "pyfakefs>=5",
  "types-networkx",
]

[project.scripts]
lythic = "lythic.presentation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lythic"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["__pycache__", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
exclude = ["build", "dist", ".venv"]

[[tool.mypy.overrides]]
module = ["networkx.*", "frontmatter.*", "watchdog.*", "pathspec.*", "PySide6.*", "PyQt6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --strict-config"
markers = [
  "unit: fast unit tests",
  "integration: service boundary tests",
  "e2e: critical journeys",
]

[tool.coverage.run]
source = ["lythic"]
branch = true
omit = [
  "lythic/presentation/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
