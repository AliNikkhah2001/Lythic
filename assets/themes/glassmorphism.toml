[theme]
name = "glassmorphism"
display = "Glassmorphism — Hyper Glass"
author = "Lythic — css.glass 451★ + Hype4 + liquidGL 833★"

[colors]
bg = "#0f172a"
bg_subtle = "#1e293b"
surface = "rgba(255,255,255,0.06)"
surface_hover = "rgba(255,255,255,0.10)"
text = "#f1f5f9"
text_muted = "#cbd5e1"
accent = "#38bdf8"
accent_hover = "#0ea5e9"
border = "rgba(255,255,255,0.25)"
border_strong = "rgba(255,255,255,0.35)"
glass_bg = "rgba(255,255,255,0.14)"
glass_border = "rgba(255,255,255,0.25)"
glass_highlight = "rgba(255,255,255,0.6)"
success = "#34d399"
warning = "#fbbf24"
error = "#fb7185"

[glass]
blur = "20px"
blur_hero = "32px"
saturate = "200%"
radius = "24px"
radius_hero = "32px"
radius_sm = "12px"
shadow = "0 8px 32px rgba(0,0,0,0.15), inset 0 1px rgba(255,255,255,0.5)"
shadow_hero = "0 24px 64px rgba(0,0,0,0.25), inset 0 1px rgba(255,255,255,0.6)"
highlight = "inset 0 1px rgba(255,255,255,0.5)"
streak_opacity = "0.45"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "32px"
2xl = "48px"

[fonts]
sans = "system-ui, -apple-system, sans-serif"
mono = "JetBrains Mono, monospace"
size = "14px"
size_sm = "12px"
size_lg = "16px"
size_xl = "20px"
line_height = "1.6"
weight_normal = "400"
weight_medium = "500"
weight_bold = "600"

[motion]
duration_fast = "120ms"
duration_normal = "200ms"
duration_slow = "400ms"
ease = "cubic-bezier(0.4, 0, 0.2, 1)"
ease_spring = "cubic-bezier(0.34, 1.56, 0.64, 1)"

[effects]
backdrop_body = "radial-gradient(ellipse at top, rgba(56,189,248,0.15) 0%, #0f172a 60%), radial-gradient(ellipse at bottom, rgba(168,85,247,0.12) 0%, transparent 70%)"
liquid_gl = true
