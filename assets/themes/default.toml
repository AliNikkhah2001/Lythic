[theme]
name = "default"
display = "Lythic Default"
author = "Lythic Design System — css.glass + Hype4"

[colors]
bg = "#0f172a"
bg_subtle = "#1e293b"
surface = "#1e293b"
surface_hover = "#334155"
text = "#e2e8f0"
text_muted = "#94a3b8"
accent = "#38bdf8"
accent_hover = "#0ea5e9"
border = "rgba(255,255,255,0.18)"
border_strong = "rgba(255,255,255,0.25)"
glass_bg = "rgba(255,255,255,0.10)"
glass_border = "rgba(255,255,255,0.18)"
glass_highlight = "rgba(255,255,255,0.5)"
success = "#34d399"
warning = "#fbbf24"
error = "#fb7185"

[glass]
blur = "16px"
blur_hero = "24px"
saturate = "180%"
radius = "12px"
radius_hero = "24px"
radius_sm = "8px"
shadow = "0 8px 32px rgba(0,0,0,0.10)"
shadow_hero = "0 16px 48px rgba(0,0,0,0.15), inset 0 1px rgba(255,255,255,0.5)"
highlight = "inset 0 1px rgba(255,255,255,0.5)"
streak_opacity = "0.35"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "32px"
2xl = "48px"

[fonts]
sans = "system-ui, -apple-system, BlinkMacSystemFont, Inter, sans-serif"
mono = "SF Mono, PT Mono, ui-monospace, monospace"
size = "14px"
size_sm = "12px"
size_lg = "16px"
size_xl = "20px"
line_height = "1.6"
weight_normal = "400"
weight_medium = "500"
weight_bold = "600"

[motion]
duration_fast = "120ms"
duration_normal = "200ms"
duration_slow = "400ms"
ease = "cubic-bezier(0.4, 0, 0.2, 1)"
ease_spring = "cubic-bezier(0.34, 1.56, 0.64, 1)"

[effects]
backdrop_body = "radial-gradient(ellipse at top, #1e293b 0%, #0f172a 60%)"
liquid_gl = false
