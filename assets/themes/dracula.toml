[theme]
name = "dracula"
display = "Dracula"
author = "Lythic — Dracula (css.glass + neumorphism contrast)"

[colors]
bg = "#282a36"
bg_subtle = "#44475a"
surface = "#44475a"
surface_hover = "#6272a4"
text = "#f8f8f2"
text_muted = "#6272a4"
accent = "#bd93f9"
accent_hover = "#a67af7"
border = "rgba(189,147,249,0.25)"
border_strong = "rgba(189,147,249,0.40)"
glass_bg = "rgba(68,71,90,0.60)"
glass_border = "rgba(189,147,249,0.25)"
glass_highlight = "rgba(248,248,242,0.35)"
success = "#50fa7b"
warning = "#f1fa8c"
error = "#ff5555"

[glass]
blur = "18px"
blur_hero = "26px"
saturate = "170%"
radius = "12px"
radius_hero = "22px"
radius_sm = "8px"
shadow = "0 8px 32px rgba(0,0,0,0.30)"
shadow_hero = "0 16px 48px rgba(0,0,0,0.40), inset 0 1px rgba(248,248,242,0.35)"
highlight = "inset 0 1px rgba(248,248,242,0.25)"
streak_opacity = "0.32"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "32px"
2xl = "48px"

[fonts]
sans = "system-ui, sans-serif"
mono = "SF Mono, PT Mono, ui-monospace, monospace"
size = "14px"
size_sm = "12px"
size_lg = "16px"
size_xl = "20px"
line_height = "1.6"
weight_normal = "400"
weight_medium = "500"
weight_bold = "600"

[motion]
duration_fast = "120ms"
duration_normal = "200ms"
duration_slow = "400ms"
ease = "cubic-bezier(0.4, 0, 0.2, 1)"
ease_spring = "cubic-bezier(0.34, 1.56, 0.64, 1)"

[effects]
backdrop_body = "radial-gradient(ellipse at top, #6272a4 0%, #282a36 65%)"
liquid_gl = false
