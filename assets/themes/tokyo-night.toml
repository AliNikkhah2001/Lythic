[theme]
name = "tokyo-night"
display = "Tokyo Night"
author = "Lythic — Tokyo Night (css.glass)"

[colors]
bg = "#1a1b26"
bg_subtle = "#24283b"
surface = "#24283b"
surface_hover = "#414868"
text = "#c0caf5"
text_muted = "#565f89"
accent = "#7aa2f7"
accent_hover = "#6d9bf0"
border = "rgba(122,162,247,0.25)"
border_strong = "rgba(122,162,247,0.35)"
glass_bg = "rgba(36,40,59,0.65)"
glass_border = "rgba(122,162,247,0.25)"
glass_highlight = "rgba(192,202,245,0.4)"
success = "#9ece6a"
warning = "#e0af68"
error = "#f7768e"

[glass]
blur = "14px"
blur_hero = "22px"
saturate = "160%"
radius = "14px"
radius_hero = "20px"
radius_sm = "8px"
shadow = "0 8px 32px rgba(0,0,0,0.25)"
shadow_hero = "0 16px 48px rgba(0,0,0,0.30), inset 0 1px rgba(192,202,245,0.4)"
highlight = "inset 0 1px rgba(192,202,245,0.3)"
streak_opacity = "0.30"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "32px"
2xl = "48px"

[fonts]
sans = "Inter, system-ui, sans-serif"
mono = "SF Mono, PT Mono, ui-monospace, monospace"
size = "14px"
size_sm = "12px"
size_lg = "16px"
size_xl = "20px"
line_height = "1.6"
weight_normal = "400"
weight_medium = "500"
weight_bold = "600"

[motion]
duration_fast = "120ms"
duration_normal = "200ms"
duration_slow = "400ms"
ease = "cubic-bezier(0.4, 0, 0.2, 1)"
ease_spring = "cubic-bezier(0.34, 1.56, 0.64, 1)"

[effects]
backdrop_body = "radial-gradient(ellipse at top, #414868 0%, #1a1b26 70%)"
liquid_gl = false
